server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API istekleri aynı origin üzerinden backend'e proxy'lenir — bu sayede
    # HttpOnly auth/refresh cookie'leri (bkz. JwtService) cross-origin/SameSite
    # sorunu yaşamadan tarayıcıdan backend'e gider.
    location /api/ {
        proxy_pass http://eventhub-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — react-router client-side routing için tüm bilinmeyen
    # yolları index.html'e düşürür.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
